name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Unit tests mock the models, so they need no downloads, torch or API keys.
      - name: Install dependencies
        run: python -m pip install -r requirements.txt numpy
      - name: Run unit tests
        run: python -m unittest discover -s tests
